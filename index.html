<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booksky</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

</head>

<body>
    <div class="navbar">
        <h1>Booksky</h1>
    </div>
    <div class="container">
        <div class="book-container">
            <h1>Think Grow Rich </h1>
            <h5>Napolean Hill</h5>
            <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Ullam quia provident architecto vero veniam
                amet, voluptate, voluptatem doloribus dolorem fugit omnis at? Repudiandae, quis modi ipsa est veritatis
                repellendus laborum!</p>
            <button onclick="dltbook(event)">Delete</button>
        </div>
    </div>

    <div class="popup-overlay"></div>
    <div class="popupbox">
        <h2>Add Book</h2>
        <form>
            <input type ="text" placeholder="Book title" id="books-title">
            <input type="text" placeholder="Book Author" id="book-author">
            <textarea placeholder="Short Description" id="Description"></textarea>
            <button id="addpopup">Add</button>
            <button id="cancelpopup">Cancel</button>
        </form>
    </div>
    
    <button class="add-button" id="add-popup">+</button>

    <script src="script.js">

    </script>

</body>

</html>
