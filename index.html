<style>
    .overlay{
        background-color: black;
        width:100%;
        height: 100%;
        position: absolute;
        top:0px;
        left:0px;
        opacity: 0.8;
        z-index:1;
        display: none;
    }
    .Popup{
        position:absolute;
        z-index: 2;
        background-color: white;
        width:40%;
        padding:20px;
        color: black;
        border-radius: 10px;
        left:30%;
        display:none;
    }

</style>
<button onclick="shows()">Show</button>
<div class="overlay"></div>
<div class="Popup">
    <p>A paragraph is a distinct section of written work, typically consisting of several sentences, that focuses on a single idea or topic</p>
<button onclick="closepopup()">close</button>
</div>


<script>
    var popupbox=document.querySelector(".Popup")
    var overlaybox=document.querySelector(".overlay")
    function shows(){
        popupbox.style.display="block";
        overlaybox.style.display="block";
    }
    function closepopup(){
        popupbox.style.display="none";
        overlaybox.style.display="none";

    }

</script>
